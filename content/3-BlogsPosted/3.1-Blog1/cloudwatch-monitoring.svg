<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">AWS monitoring trade-offs</title><desc id="desc">Conceptual illustration of EC2 monitoring, CloudWatch metrics and SNS alerts, comparing five-minute basic monitoring with one-minute detailed monitoring.</desc>
<rect width="1000" height="480" rx="18" fill="#f4f7fb"/><rect x="0" y="0" width="1000" height="100" rx="18" fill="#232f3e"/><path d="M0 80H1000V100H0Z" fill="#232f3e"/>
<g font-family="Arial, sans-serif" fill="#fff"><text x="40" y="43" font-size="30" font-weight="bold">AWS monitoring: visibility vs. cost</text><text x="40" y="73" font-size="17" fill="#d5dce5">Giám sát AWS: khả năng theo dõi và chi phí</text></g>
<g font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#232f3e" font-weight="bold"><rect x="40" y="130" width="250" height="86" rx="12" fill="white" stroke="#e5a12c" stroke-width="2"/><rect x="375" y="130" width="250" height="86" rx="12" fill="white" stroke="#e5a12c" stroke-width="2"/><rect x="710" y="130" width="250" height="86" rx="12" fill="white" stroke="#e5a12c" stroke-width="2"/><text x="165" y="165">Amazon EC2</text><text x="500" y="165">CloudWatch</text><text x="835" y="165">Amazon SNS</text><g font-size="15" font-weight="normal" fill="#536173"><text x="165" y="193">Infrastructure / Hạ tầng</text><text x="500" y="193">Metrics / Chỉ số</text><text x="835" y="193">Alerts / Cảnh báo</text></g></g>
<g stroke="#e5a12c" stroke-width="4" fill="none" stroke-linecap="round"><path d="M300 173H363m-10 -8 10 8 -10 8"/><path d="M635 173H698m-10 -8 10 8 -10 8"/></g>
<g font-family="Arial,sans-serif" fill="#232f3e"><rect x="40" y="246" width="450" height="154" rx="12" fill="white" stroke="#cbd5e1"/><rect x="510" y="246" width="450" height="154" rx="12" fill="white" stroke="#cbd5e1"/><text x="65" y="278" font-size="17" font-weight="bold">BASIC / CƠ BẢN</text><text x="535" y="278" font-size="17" font-weight="bold">DETAILED / CHI TIẾT</text><text x="65" y="330" font-size="39" font-weight="bold" fill="#226f8b">5 min</text><text x="535" y="330" font-size="39" font-weight="bold" fill="#b8751b">1 min</text><text x="65" y="365" font-size="17">Lower monitoring overhead</text><text x="535" y="365" font-size="17">Finer visibility; possible extra cost</text><text x="65" y="386" font-size="15" fill="#536173">Giảm chi phí giám sát</text><text x="535" y="386" font-size="15" fill="#536173">Theo dõi chi tiết; có thể tốn thêm phí</text><text x="40" y="443" font-size="15" fill="#536173">Illustration: typical EC2 metric intervals / Minh họa chu kỳ của phần lớn chỉ số EC2</text></g>
</svg>
